[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-ai-bridge"
version = "0.2.0"
description = "Windows-to-Linux user-scoped SSH reverse-proxy bridge"
requires-python = ">=3.10"
dependencies = [
    "paramiko==5.0.0",
    "fastapi==0.141.1",
    "uvicorn==0.50.2",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
rab = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
