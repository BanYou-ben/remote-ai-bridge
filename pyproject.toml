[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-ai-bridge"
version = "0.1.0"
description = "Windows-to-Linux user-scoped SSH reverse-proxy bridge"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rab = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
